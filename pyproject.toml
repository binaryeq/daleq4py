[project]
name = "daleq4py"
version = "0.1.0"
description = "CLI tool to establish the equivalence of alternatively built python packages."
authors = [{ name = "Jens Dietrich", email = "jens.dietrich@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["packaging>=24", "lark>=1.1"]

[project.scripts]
daleq4py = "daleq4py.cli:main"
extract-edb = "daleq4py.extract_edb:main"
inference = "daleq4py.inference:main"
project-idb = "daleq4py.project_idb:main"
parse-provenance = "daleq4py.parse_provenance:main"
normalise-pysrc = "daleq4py.normalise_pysrc:main"
compare-wheels = "daleq4py.compare_wheels:main"
run-experiments = "daleq4py.run_experiments:main"

[tool.poetry]
packages = [{ include = "daleq4py", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
