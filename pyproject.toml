[project]
name = "daleq4py"
version = "1.0.1"
description = "CLI for comparing alternatively built Python packages; Soufflé is required for inference-based commands."
authors = [{ name = "Jens Dietrich", email = "jens.dietrich@gmail.com" }]
readme = "README.md"
license = "UPL-1.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.14"
dependencies = ["packaging>=24", "lark>=1.1"]
keywords = ["python", "wheel", "reproducible-builds", "supply-chain-security"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/binaryeq/daleq4py"
Repository = "https://github.com/binaryeq/daleq4py"
Issues = "https://github.com/binaryeq/daleq4py/issues"

[project.scripts]
daleq4py = "daleq4py.cli:main"
extract-edb = "daleq4py.extract_edb:main"
inference = "daleq4py.inference:main"
project-idb = "daleq4py.project_idb:main"
parse-provenance = "daleq4py.parse_provenance:main"
normalise-pysrc = "daleq4py.normalise_pysrc:main"
compare-wheels = "daleq4py.compare_wheels:main"
run-experiments = "daleq4py.run_experiments:main"
wheel-diff = "daleq4py.wheel_diff:main"

[tool.poetry]
packages = [{ include = "daleq4py", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
